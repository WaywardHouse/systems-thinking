# Publish this book to GitHub Pages at https://wayward.house/systems-thinking/
#
# The URL comes from the repo name: GitHub serves every WaywardHouse repo that
# has Pages enabled under the org site's domain (wayward.house/<repo-name>/).
# So this repo must be named "systems-thinking" and be public.
#
# One-time setup: Settings → Pages → Source: GitHub Actions. No secrets needed.

name: Publish book

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render
        run: quarto render

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
